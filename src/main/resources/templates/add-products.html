<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            margin-top:50px;
            border-radius:10px;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            margin-top:15px;
        }

    </style>
    <link rel="stylesheet" th:href="@{/css/modern.css}">
</head>
<body>

<div class="box">

    <h2>Add Product</h2>

	<form th:action="@{/saveProduct}"
	      th:object="${product}"
	      method="post"
	      enctype="multipart/form-data">
		  
		  <input type="hidden" name="id" th:value="${product != null ? product.id : ''}">

		  <input type="text"
		         name="name"
		         placeholder="Product Name"
		         th:value="${product != null ? product.name : ''}">

		  <input type="number"
		         name="price"
		         placeholder="Price"
		         th:value="${product != null ? product.price : ''}">

		  <textarea name="description"
		            placeholder="Description"
		            th:text="${product != null ? product.description : ''}">
		  </textarea>

	    <input type="file" name="image">

	    <button type="submit"
	            th:text="${product.id != null ? 'Update Product' : 'Save Product'}">
	        Save Product
	    </button>

	</form>

</div>

</body>
</html>
