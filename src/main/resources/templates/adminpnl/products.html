<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            background: #f3f4f6;
        }

		.sidebar {
		            width: 250px;
		            height: 100vh;
		            background: linear-gradient(#111827,rgb(57, 81, 130));
		            padding: 20px;
					position: fixed;
					top: 0;
					left: 0;
					overflow-y: auto;
		        }

		        .logo {
		            color: white;
		            font-size: 28px;
		            text-align: center;
		            margin-bottom: 40px;
		            font-weight: bold;
		            background: #2563eb;
		            padding: 25px;
		            border-radius: 25px;
		        }

		        .sidebar a {
		            display: block;
		            color: white;
		            text-decoration: none;
		            padding: 18px;
		            margin-bottom: 20px;
		            border-radius: 8px;
		            display: flex;
		            justify-content: center;
		            align-items: center;
					background-color: #2563eb;
		        }

		        .sidebar a:hover {
		            background: #2563eb;
		        }

		        .logout-btn {
		            width: 100%;
		            padding: 20px;
		            border: none;
		            border-radius: 8px;
		            background: #dc2626;
		            color: white;
		            cursor: pointer;
		            font-size: 15px;
		            margin-top: 35px;
		        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .main {
            flex: 1;
            padding: 30px;
			margin-left: 250px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 20px;
            background-color: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .page-header h1 {
            color: #111827;
        }

        .search-box input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #ddd;
        }

        .search-box button {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: rgb(226, 33, 181);
            color: black !important;
        }


        .btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: orange;
        }

        .product-container {
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 25px;
        }

        .card {
            width: 280px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .price {
            text-align: center;
            color: orange;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .add-btn {
            width: 48%;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            background-color: #111827;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .add-btn:hover {
            background-color: orange;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/modern.css}">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">ShopEase Admin</div>
        <a th:href="@{/admin}">Dashboard</a>
        <a th:href="@{/adminpnl/products}">Products</a>
        <a th:href="@{/adminpnl/orders}">Orders</a>
        <a th:href="@{/adminpnl/users}">Users</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>
    </div>
    <!-- Main Content -->
    <div class="main">
        <div class="page-header">
            <h1>Products Management</h1>
            <form th:action="@{/adsearch}" method="get" class="search-box">
                <input type="text" name="keyword" placeholder="Search Product..." th:value="${keyword}">
                <button type="submit">Search</button>
            </form>

            <a th:href="@{/add-products}" class="btn">
                Add Product
            </a>
        </div>
        <div class="product-container">
            <div th:each="p : ${products}" class="card">
                <img th:src="@{'/uploads/' + ${p.imgName}}" alt="Product Image">
                <div class="card-content">
                    <h3 th:text="${p.name}"></h3>
                    <div class="price">
                        <span th:text="${p.price}"></span>
                    </div>
                    <div class="description">
                        <p th:text="${p.description}"></p>
                    </div>
                    <div class="button-group">
                        <a th:href="@{/edit-product/{id}(id=${p.id})}" class="add-btn"
						onclick="return confirm('are you sure you want to update this product?')">
                            Update
                        </a>
                        <a th:href="@{/delete-product/{id}(id=${p.id})}" class="add-btn"
                            onclick="return confirm('Are you sure you want to delete this product?')">
                            Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
