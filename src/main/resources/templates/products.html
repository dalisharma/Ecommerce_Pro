<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
        }

        /* ---------- NAVBAR ---------- */

        .navbar {
            width: 100%;
            background-color: #111827;
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
			z-index: 1000; 
        }

        .logo {
            color: orange;
            font-size: 45px;
            font-weight: bold;
        }

        /* .logo span {
            color: orange;
        } */

        .search-box {
            width: 700px;
            background-color: white;
            padding: 10px;
            border-radius: 50px;

            display: flex;
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 17px;
        }

        .search-box button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background-color: orange;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: rgb(226, 33, 181);
            color: black !important;
        }

        .cart-btn {
            background-color: orange;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .cart-btn:hover {
            background-color: rgb(226, 33, 181);
            color: black !important;
        }

        .product-container {
            margin: 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 35px;
        }

        .card {
            width: 280px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
			margin: 20px;
            transition: 0.3s;
			border: 10px solid white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
        }

        .card-content {
            padding: 20px;
        }
		.card-content p{
		            text-align: center;
		        }
		.description {
			    min-height: 50px;
			}

        .card-content h3 {
            margin-bottom: 10px;
            color: #111827;
			text-align: center;
			font-weight: bold;
        }

        .price {
            color: orange;
            font-size: 22px;
			text-align: center;			
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            border: none;
            background-color: #111827;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn:hover {
            background-color: orange;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/modern.css}">

</head>

<body>
    <div class="navbar">
        <div class="logo">
            <span>All Products</span>
        </div>
        <form th:action="@{/search}" method="get" class="search-box">
            <input type="text" name="keyword" placeholder="Search Product" th:value="${keyword}">
            <button type="submit">Search</button>
        </form>
        <div class="nav-links">
            <a href="/cart" class="cart-btn">Cart</a>
        </div>
    </div>

    <div class="product-container">
        <div th:each="p : ${products}" class="card">
            <img th:src="@{'/uploads/' + ${p.imgName}}">
            <div class="card-content">
                <h3 th:text="${p.name}"></h3>
                <div class="price">
                    <p th:text="${p.price}"></p>
                </div>
                <p class="description" th:text="${p.description}"></p>
                <a th:href="@{/add-to-cart/{id}(id=${p.id})}" class="add-btn">
                    Add To Cart
                </a>
            </div>
        </div>
    </div>
</body>

</html>
